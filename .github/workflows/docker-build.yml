name: Build web image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute tags and labels
        id: meta
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          {
            echo "image=$image"
            echo "revision=$revision"
            echo "tags=${image}:${revision}"
            echo "labels<<EOF_LABELS"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${revision}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF_LABELS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Report digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest: '${DIGEST}'"
            exit 1
          fi
          {
            echo "### web"
            echo
            echo "- Reference: \`${IMAGE}@${DIGEST}\`"
            echo "- Tag: \`${TAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
